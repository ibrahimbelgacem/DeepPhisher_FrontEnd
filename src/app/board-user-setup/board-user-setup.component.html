<div *ngIf="showForm" class="user-setup-form">
  <h2>Complétez vos informations</h2>
  <form (ngSubmit)="submitForm()" #form="ngForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        [(ngModel)]="userData.username"
        name="username"
        class="form-control"
        readonly
      />
    </div>

    <div class="form-group">
      <label for="appEmail">Email</label>
      <input
        id="appEmail"
        [(ngModel)]="userData.appEmail"
        name="appEmail"
        class="form-control"
        required
      />
    </div>

    <div class="form-group">
      <label for="appPassword">Mot de passe IMAP</label>
      <input
        id="appPassword"
        [(ngModel)]="userData.appPassword"
        name="appPassword"
        type="password"
        class="form-control"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      Valider
    </button>
  </form>
</div>
